<!DOCTYPE html>

<html class="light" lang="en"><head>

<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

                "on-tertiary-fixed": "#351000",
                "on-secondary-fixed-variant": "#38485d",
                "on-primary-fixed-variant": "#1d34ba",
                "on-secondary-container": "#54647a",

                "tertiary-fixed-dim": "#ffb694",

        },
        "borderRadius": {

        "spacing": {

<body class="bg-background text-on-background font-body-lg min-h-screen flex flex-col items-center justify-center p-md sm:p-lg">
<main class="w-full max-w-2xl bg-surface-container-lowest rounded-xl shadow-[0_2px_4px_rgba(0,0,0,0.05)] border border-outline-variant overflow-hidden flex flex-col">
<!-- Header -->
<header class="flex items-center justify-between px-lg py-md border-b border-outline-variant bg-surface-container-low">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary" data-icon="edit_document">edit_document</span>
<h1 class="font-headline-md text-headline-md text-on-surface">Edit Record</h1>
</div>
<div class="flex items-center gap-sm bg-tertiary-container/10 px-sm py-xs rounded-full border border-tertiary-container/20">
<span class="material-symbols-outlined text-tertiary text-[14px]" data-icon="sync_problem">sync_problem</span>
<span class="font-label-sm text-label-sm text-tertiary uppercase tracking-wider">Unsaved Changes</span>
</div>
</header>
<!-- Form Area -->
<div class="p-lg flex-grow flex flex-col gap-lg">
<!-- Title Field (Required with Validation Error) -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center gap-xs" for="record-title">
                    Title <span class="text-error">*</span>
</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-error rounded-DEFAULT px-md py-sm font-body-md text-body-md text-on-surface focus:outline-none focus:ring-1 focus:ring-error focus:border-error transition-colors pr-10" id="record-title" placeholder="Enter record title" type="text" value=""/>
<span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 text-error" data-icon="error">error</span>
</div>
<p class="font-body-sm text-body-sm text-error flex items-center gap-xs mt-1">
                    Title is a required field.
                </p>
</div>
<!-- Description Field (Optional) -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant flex justify-between items-end" for="record-description">
<span>Description <span class="text-secondary opacity-60 font-normal">(Optional)</span></span>
</label>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded-DEFAULT px-md py-sm font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors resize-y min-h-[100px]" id="record-description" placeholder="Add detailed notes here..." rows="4"></textarea>
</div>
<!-- Two Column Layout for Priority and Category -->
<div class="grid grid-cols-1 sm:grid-cols-2 gap-md">
<!-- Priority Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant">Priority</label>
<div class="flex gap-sm h-[42px]">
<label class="flex-1 cursor-pointer">
<input checked="" class="peer sr-only" name="priority" type="radio" value="normal"/>
<div class="h-full flex items-center justify-center gap-xs px-sm py-xs border border-outline-variant rounded-DEFAULT bg-surface-container-lowest text-on-surface-variant peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:border-primary-container transition-colors">
<span class="material-symbols-outlined text-[18px]" data-icon="horizontal_rule">horizontal_rule</span>
<span class="font-body-sm text-body-sm font-medium">Normal</span>
</div>
</label>
<label class="flex-1 cursor-pointer">
<input class="peer sr-only" name="priority" type="radio" value="pinned"/>
<div class="h-full flex items-center justify-center gap-xs px-sm py-xs border border-outline-variant rounded-DEFAULT bg-surface-container-lowest text-on-surface-variant peer-checked:bg-tertiary-container peer-checked:text-on-tertiary-container peer-checked:border-tertiary-container transition-colors">
<span class="material-symbols-outlined text-[18px]" data-icon="push_pin">push_pin</span>
<span class="font-body-sm text-body-sm font-medium">Pinned</span>
</div>
</label>
</div>
</div>
<!-- Category Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="record-category">Category</label>
<div class="relative h-[42px]">
<select class="appearance-none w-full h-full bg-surface-container-lowest border border-outline-variant rounded-DEFAULT px-md py-sm font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors cursor-pointer pr-10" id="record-category">
<option disabled="" selected="" value="">Select category</option>
<option value="research">Research</option>
<option value="meetings">Meetings</option>
<option value="ideas">Ideas</option>
<option value="tasks">Tasks</option>
</select>
<span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-icon="arrow_drop_down">arrow_drop_down</span>
</div>
</div>
</div>
</div>
<!-- Footer Actions -->
<footer class="px-lg py-md border-t border-outline-variant bg-surface-container-low flex justify-end gap-sm items-center">
<button class="px-lg py-sm rounded-DEFAULT border border-outline-variant text-on-surface bg-transparent hover:bg-surface-container transition-colors duration-200 font-label-md text-label-md font-medium" type="button">
                Cancel
            </button>
<button class="px-lg py-sm rounded-DEFAULT bg-primary text-on-primary hover:bg-on-primary-fixed-variant transition-colors duration-200 font-label-md text-label-md font-medium flex items-center gap-xs shadow-sm" type="button">
<span class="material-symbols-outlined text-[18px]" data-icon="save">save</span>
                Save Record
            </button>
</footer>
</main>
</body></html>
